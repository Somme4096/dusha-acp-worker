[project]
name = "dusha-acp-worker"
version = "0.1.0"
description = "A Discord DM companion driven by any ACP agent, such as maki, with dusha's proactive messages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4,<3", "httpx>=0.27,<1"]

[project.scripts]
dusha-acp-worker = "dusha_acp_worker.__main__:main"

[dependency-groups]
dev = ["dusha>=1.1.21", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "uvicorn>=0.30,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
